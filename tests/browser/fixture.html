<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles/mobile.css" />
    <style>
      body {
        margin: 0;
        background: #23372f;
      }
      #board {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #notifications {
        position: fixed;
        top: 0;
      }
      .fixture-map {
        background:
          linear-gradient(0deg, #ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px), #23372f;
        background-size: 50px 50px;
      }
    </style>
  </head>
  <body>
    <canvas id="board" class="fixture-map"></canvas>
    <div id="ui-right">
      <div id="sidebar">
        <div id="sidebar-tabs"></div>
        <div id="sidebar-content">
          <div id="chat">
            <div class="chat-log"><p>Native chat fixture</p></div>
            <textarea id="chat-message"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div id="notifications"></div>
    <script type="module" src="/tests/browser/fixture.mjs"></script>
  </body>
</html>
